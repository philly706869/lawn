name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data_ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.data_ref || 'data' }}
          path: data
      - run: cp data/data.json source/src/lib/data.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci && npm run build
        working-directory: source
      - uses: actions/upload-pages-artifact@v5
        with:
          path: source/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
